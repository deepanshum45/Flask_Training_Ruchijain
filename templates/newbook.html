<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>New Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="form-container">

        <h1>Library Management System</h1>

        <h2>New Book</h2>

        <p>Add a new book to the library</p>


        <form method="POST">


            <!-- Book Name -->

            <label for="book_name">
                Book Name
            </label>

            <input
                type="text"
                id="book_name"
                name="book_name"
                placeholder="Enter book name"
                required>


            <br><br>


            <!-- Author -->

            <label for="author">
                Author
            </label>

            <input
                type="text"
                id="author"
                name="author"
                placeholder="Enter author name"
                required>


            <br><br>


            <!-- Category -->

            <label for="category">
                Category
            </label>

            <input
                type="text"
                id="category"
                name="category"
                placeholder="Enter book category"
                required>


            <br><br>


            <!-- Price -->

            <label for="price">
                Price
            </label>

            <input
                type="number"
                id="price"
                name="price"
                placeholder="Enter book price"
                required>


            <br><br>


            <!-- Submit -->

            <button type="submit">
                Add Book
            </button>

        </form>


        <br>


        <a href="{{ url_for('dashboard') }}">

            <button type="button">
                Back to Dashboard
            </button>

        </a>

    </div>

</body>

</html>
