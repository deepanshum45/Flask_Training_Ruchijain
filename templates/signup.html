<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Library - Sign Up</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="form-container">

        <h1>Library Management System</h1>

        <h2>Sign Up</h2>

        <p>Create your account</p>


        <form method="POST">


            <!-- Name -->

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required>


            <br><br>


            <!-- Username -->

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required>


            <br><br>


            <!-- Email -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>


            <br><br>


            <!-- Password -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>


            <br><br>


            <!-- Submit -->

            <button type="submit">
                Sign Up
            </button>


        </form>


        <br>


        <p>
            Already have an account?
        </p>


        <a href="{{ url_for('login') }}">

            <button type="button">
                Login
            </button>

        </a>


        <br><br>


        <a href="{{ url_for('home') }}">
            Back to Home
        </a>


    </div>

</body>

</html>
