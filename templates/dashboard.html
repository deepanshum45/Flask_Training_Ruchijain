<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Library Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="dashboard-container">

        <header>

            <h1>Library Management System</h1>

            <p>
                Welcome, {{ session['username'] }}
            </p>

        </header>


        <main>

            <h2>Dashboard</h2>

            <p>Select an option</p>


            <div class="dashboard-box">


                <!-- New Book -->

                <div class="menu-box">

                    <h3>New Book</h3>

                    <p>
                        Add a new book to the library.
                    </p>

                    <a href="{{ url_for('newbook') }}">

                        <button type="button">
                            New Book
                        </button>

                    </a>

                </div>


                <!-- View Book -->

                <div class="menu-box">

                    <h3>View Book</h3>

                    <p>
                        View all books in the library.
                    </p>

                    <a href="{{ url_for('viewbook') }}">

                        <button type="button">
                            View Book
                        </button>

                    </a>

                </div>


            </div>


            <br><br>


            <!-- Logout -->

            <a href="{{ url_for('logout') }}">

                <button type="button">
                    Logout
                </button>

            </a>


        </main>

    </div>

</body>

</html>
